<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b7a75">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ITパスポート 学習ドリル</title>
  <style>
    :root{--ink:#19324a;--muted:#66788a;--bg:#f4f7f9;--card:#fff;--accent:#0b7a75;--accent2:#f3a712;--ok:#178447;--ng:#c0392b;--line:#dbe4ea}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.65}
    header{background:linear-gradient(125deg,#123b57,#0b7a75);color:#fff;padding:30px 20px 42px}header>div,main{max-width:900px;margin:auto}h1{font-size:clamp(25px,5vw,38px);margin:0 0 6px}.sub{margin:0;opacity:.86}
    main{padding:0 18px 50px;margin-top:-22px}.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 7px 25px #18384d14;margin-bottom:18px}.hidden{display:none!important}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f1f7f7;border-radius:11px;text-align:center;padding:12px 5px}.stat b{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}
    h2{font-size:20px;margin:0 0 16px}.controls{display:flex;gap:10px;flex-wrap:wrap}button,select,input{font:inherit;border-radius:9px;border:1px solid var(--line);padding:11px 15px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.secondary{background:#eef7f6;color:var(--accent);border-color:#b6d9d6}button:disabled{opacity:.45;cursor:not-allowed}.auth-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sync-status{display:flex;align-items:center;gap:8px;margin-bottom:12px}.dot{width:10px;height:10px;border-radius:50%;background:#9aa8b4}.dot.on{background:var(--ok)}.dot.busy{background:var(--accent2)}
    .bars{display:grid;gap:12px}.bar-label{display:flex;justify-content:space-between;font-size:14px}.track{height:9px;background:#e8eef2;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:20px}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#e8f4f3;color:var(--accent);font-size:12px;font-weight:700}.question{font-size:19px;font-weight:700;margin:14px 0 18px}.official-page{display:block;width:100%;height:auto;margin:12px auto 0;border:1px solid var(--line);border-radius:8px}.choices{display:grid;gap:10px}.choice{text-align:left;font-weight:500}.choice.correct{border-color:var(--ok);background:#eaf7f0}.choice.wrong{border-color:var(--ng);background:#fff0ee}.choice .letter{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#eef2f5;margin-right:9px;font-weight:800}.feedback{margin-top:18px;padding:15px;border-radius:10px;background:#f7f9fa;border-left:5px solid var(--accent2)}.feedback.ok{border-color:var(--ok)}.feedback.ng{border-color:var(--ng)}.feedback b{display:block;margin-bottom:4px}.source{color:var(--muted);font-size:12px;margin:8px 0 0}.quiz-top{display:flex;justify-content:space-between;align-items:center}.progress{height:6px;background:#e5ecef;margin:14px 0 4px;border-radius:6px}.progress>div{height:100%;background:var(--accent2);border-radius:6px}.next{margin-top:16px;display:flex;justify-content:flex-end}.note{color:var(--muted);font-size:13px}.note a{color:var(--accent)}.empty{text-align:center;color:var(--muted);padding:15px}
    @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.auth-fields{grid-template-columns:1fr}.card{padding:17px}header{padding-top:23px}.question{font-size:17px}}
  </style>
</head>
<body>
<header><div><h1>ITパスポート 学習ドリル</h1><p class="sub">4択で理解を固め、苦手分野を見える化</p></div></header>
<main>
  <section id="home">
    <div class="card"><div class="stats"><div class="stat"><b id="answered">0</b><span>回答数</span></div><div class="stat"><b id="rate">—</b><span>正答率</span></div><div class="stat"><b id="streak">0</b><span>連続正解</span></div><div class="stat"><b id="reviewCount">0</b><span>復習問題</span></div></div></div>
    <div class="card"><h2>端末間で成績を同期</h2><div class="sync-status"><span class="dot" id="syncDot"></span><span id="syncStatus">同期設定を確認中…</span></div><div id="authSignedOut"><div class="auth-fields"><input id="authEmail" type="email" autocomplete="email" placeholder="メールアドレス"><input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="パスワード（6文字以上）"></div><div class="controls" style="margin-top:10px"><button class="primary" id="signIn">ログイン</button><button id="signUp">新規アカウント作成</button></div></div><div id="authSignedIn" class="hidden"><span id="authUser"></span><button id="signOut" style="margin-left:10px">ログアウト</button></div><p class="note" id="syncHelp">同じアカウントでログインすると、iPhoneとiPadの成績が同期されます。</p></div>
    <div class="card"><h2>学習を始める</h2><div class="controls"><select id="category"><option value="all">全分野（ランダム）</option><option value="ストラテジ">ストラテジ</option><option value="マネジメント">マネジメント</option><option value="テクノロジ">テクノロジ</option></select><button class="primary" id="start">10問に挑戦</button><select id="examYear"><option value="r07">令和7年度</option><option value="r06">令和6年度</option><option value="r05">令和5年度</option><option value="r04">令和4年度</option><option value="r03">令和3年度</option></select><button class="secondary" id="yearExam">選択年度・全100問</button><button class="secondary" id="review">間違いを復習</button></div><p class="note">全500問（公式問題5年分）。進捗はこのブラウザ内に自動保存されます。問題文・選択肢・正答はIPAの<a href="https://www3.jitec.ipa.go.jp/JitesCbt/html/openinfo/questions.html" target="_blank" rel="noopener">公開過去問題</a>を出典明記の上で使用しています。©2021–2025 独立行政法人情報処理推進機構</p></div>
    <div class="card"><h2>分野別の成績</h2><div class="bars" id="bars"></div></div>
  </section>
  <section id="quiz" class="hidden"><div class="card"><div class="quiz-top"><span class="tag" id="qcat"></span><span id="count"></span></div><div class="progress"><div id="progress"></div></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback hidden"></div><div class="next"><button id="next" class="primary hidden">次の問題</button></div></div></section>
  <section id="result" class="hidden"><div class="card" style="text-align:center"><span class="tag">RESULT</span><h2 style="font-size:27px;margin-top:12px">今回の結果</h2><div id="score" style="font-size:44px;font-weight:800;color:var(--accent)"></div><p id="message"></p><div class="controls" style="justify-content:center"><button class="primary" id="again">もう一度</button><button id="toHome">ホームへ</button></div></div></section>
</main>
<script>
const Q=[];
const officialAnswers='ウウイエウイイイウエエエウイアイアアアイイウウエアウイエイエイウアイエアエエアイエアアエアイエアウアエアイアアアイウアエウアウイアイイウイエエイウアウウイエアウエウウイイエウイアエエアウイウウアウウア';
const pageRanges=[[2,1,2],[3,3,5],[4,6,7],[5,8,9],[6,10,12],[7,13,15],[8,16,17],[9,18,19],[10,20,22],[11,23,24],[12,25,26],[13,27,29],[14,30,31],[15,32,34],[16,35,35],[17,36,37],[18,38,39],[19,40,41],[20,42,44],[21,45,46],[22,47,48],[23,49,51],[24,52,53],[25,54,54],[26,55,55],[27,56,57],[28,58,60],[29,61,62],[30,63,65],[31,66,66],[32,67,69],[33,70,71],[34,72,72],[35,73,74],[36,75,76],[37,77,79],[38,80,82],[39,83,84],[40,85,87],[41,88,89],[42,90,91],[43,92,94],[44,95,97],[45,98,98],[46,99,99],[47,100,100]];
const pageFor=n=>pageRanges.find(x=>n>=x[1]&&n<=x[2])[0];
const kana={'ア':0,'イ':1,'ウ':2,'エ':3};
Q.push(...Array.from({length:100},(_,i)=>{let n=i+1,p=String(pageFor(n)).padStart(2,'0'),cat=n<=35?'ストラテジ':n<=55?'マネジメント':'テクノロジ';return [cat,`令和7年度 公開問題 問${n}（画像内の問${n}を解答してください）<img class="official-page" src="it-passport-assets/page-${p}.jpg" alt="令和7年度公開問題 問${n}掲載ページ">`,['ア','イ','ウ','エ'],kana[officialAnswers[i]],'IPA公式解答例に基づく正答です。','出典：令和7年度 ITパスポート試験 公開問題 問'+n,true,'r07']}));
const olderYears={
 r06:{label:'令和6年度',answers:'エイウイイエイウアイイアエアウイエウウイウウアウアアイアイエエイエエエアエイエアイイイアエエウイアエエアウウウイウエイイアエアイウエウウイウイウエエエウウアエアエイエエエウエアウアエウイアイウイイウイ',ends:[2,5,7,9,11,14,17,20,23,26,28,31,34,35,38,40,42,45,47,49,51,54,55,58,60,61,63,65,67,71,73,76,78,80,81,84,85,88,90,92,94,96,99,100]},
 r05:{label:'令和5年度',answers:'エアエイエウアイイエウウエアエエウウウウウウイアエイイアエアアエイウアアアイウウウエエウアウアエアアエエアエイイエウエアイエイウアイウエイアアウイエウウウイウエアアエエウアアウイイエエエエアイイイウエ',ends:[3,5,8,11,13,15,17,20,23,25,28,31,33,35,37,40,42,44,46,48,51,53,55,57,58,60,61,63,65,68,70,72,74,75,77,80,83,85,87,90,93,96,99,100]},
 r04:{label:'令和4年度',answers:'エイウアイウイエアアイエエアエエウアエイイイイエアイエエアイエエアアイアイエアウイアエエエイウウアエイイエウアアウイエエエアアアアアイアアウイアウアウイイイイエアウウエアアアイウアイイアアウエエイアウ',ends:[3,6,8,10,12,14,16,19,21,23,26,28,31,34,35,37,39,42,44,47,50,52,54,56,58,60,62,65,67,69,71,74,77,78,80,82,85,87,89,91,94,96,98,100]},
 r03:{label:'令和3年度',answers:'ウエウアウウアアエエエウウイアウアエアイイアエアウウウウアアアイウウアエエイエアアエウウアウイエウアエイイエアイエアウウイアイエエエアアウアウアイエアイエエウアエイアエイウエイイエイイアアウエウエアイ',ends:[3,5,8,10,12,14,16,18,20,23,26,29,31,33,35,37,39,42,45,47,49,50,52,54,55,58,60,63,66,68,69,70,73,74,77,80,83,86,89,92,94,95,98,100]}
};
for(const [key,year] of Object.entries(olderYears))Q.push(...Array.from({length:100},(_,i)=>{let n=i+1,page=year.ends.findIndex(end=>n<=end)+2,p=String(page).padStart(2,'0'),cat=n<=35?'ストラテジ':n<=55?'マネジメント':'テクノロジ';return [cat,`${year.label} 公開問題 問${n}（画像内の問${n}を解答してください）<img class="official-page" src="it-passport-assets/${key}/page-${p}.jpg" alt="${year.label}公開問題 問${n}掲載ページ">`,['ア','イ','ウ','エ'],kana[year.answers[i]],'IPA公式解答例に基づく正答です。',`出典：${year.label} ITパスポート試験 公開問題 問${n}`,true,key]}));
const KEY='itp-study-v3',DATA_VERSION=4;
const emptyData=()=>({total:0,correct:0,streak:0,wrong:[],cats:{},questionSetVersion:DATA_VERSION});
function migrateData(value){let oldVersion=Number(value?.questionSetVersion)||3,d=value&&typeof value==='object'?{...emptyData(),...value}:emptyData();d.wrong=Array.isArray(d.wrong)?d.wrong:[];d.cats=d.cats&&typeof d.cats==='object'?d.cats:{};if(oldVersion<DATA_VERSION)d.wrong=[...new Set(d.wrong.filter(i=>Number.isInteger(i)&&i>=18&&i<518).map(i=>i-18))];else d.wrong=d.wrong.filter(i=>Number.isInteger(i)&&i>=0&&i<Q.length);d.questionSetVersion=DATA_VERSION;return d}
let storedData;try{storedData=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){storedData=null}let data=migrateData(storedData);localStorage.setItem(KEY,JSON.stringify(data));let session=[],pos=0,score=0,locked=false,lastMode='all';
const $=id=>document.getElementById(id),save=()=>{data.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(data));window.cloudSync?.push(data)};
window.studySyncBridge={get:()=>JSON.parse(JSON.stringify(data)),apply:remote=>{let needsCloudMigration=(Number(remote?.questionSetVersion)||3)<DATA_VERSION;data=migrateData(remote);localStorage.setItem(KEY,JSON.stringify(data));if(!$('home').classList.contains('hidden'))renderHome();if(needsCloudMigration)setTimeout(()=>window.cloudSync?.push(data),0)}};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderHome(){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!=='home'));$('answered').textContent=data.total;$('rate').textContent=data.total?Math.round(data.correct/data.total*100)+'%':'—';$('streak').textContent=data.streak;$('reviewCount').textContent=data.wrong.length;$('review').disabled=!data.wrong.length;$('bars').innerHTML=['ストラテジ','マネジメント','テクノロジ'].map(c=>{let s=data.cats[c]||{a:0,c:0},r=s.a?Math.round(s.c/s.a*100):0;return `<div><div class="bar-label"><span>${c}</span><span>${s.a?r+'%（'+s.c+'/'+s.a+'）':'未回答'}</span></div><div class="track"><div class="fill" style="width:${r}%"></div></div></div>`}).join('')}
function begin(mode){lastMode=mode;let isYear=/^r0[3-7]$/.test(mode),pool=mode==='review'?Q.filter((_,i)=>data.wrong.includes(i)):isYear?Q.filter(q=>q[7]===mode):mode==='all'?Q:Q.filter(q=>q[0]===mode);session=isYear?pool.map(q=>Q.indexOf(q)):shuffle(pool.map(q=>Q.indexOf(q))).slice(0,10);pos=score=0;showQ()}
function showQ(){locked=false;['home','result'].forEach(x=>$(x).classList.add('hidden'));$('quiz').classList.remove('hidden');let q=Q[session[pos]];$('qcat').textContent=q[0];$('count').textContent=`${pos+1} / ${session.length}`;$('progress').style.width=((pos+1)/session.length*100)+'%';$('question').innerHTML=q[1].replace(/\n/g,'<br>')+`<p class="source">${q[5]}</p>`;$('feedback').className='feedback hidden';$('next').classList.add('hidden');$('choices').innerHTML=q[2].map((c,i)=>`<button class="choice" data-i="${i}"><span class="letter">${'ABCD'[i]}</span>${c}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(i){if(locked)return;locked=true;let qi=session[pos],q=Q[qi],ok=i===q[3],cat=q[0];data.total++;data.cats[cat]??={a:0,c:0};data.cats[cat].a++;if(ok){score++;data.correct++;data.streak++;data.cats[cat].c++;data.wrong=data.wrong.filter(x=>x!==qi)}else{data.streak=0;if(!data.wrong.includes(qi))data.wrong.push(qi)}save();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let f=$('feedback');f.className='feedback '+(ok?'ok':'ng');f.innerHTML=`<b>${ok?'正解です！':'不正解。正解は '+('ABCD'[q[3]])+' です。'}</b>${q[4]}<p class="source">${q[5]}</p>`;$('next').textContent=pos===session.length-1?'結果を見る':'次の問題';$('next').classList.remove('hidden')}
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${score} / ${session.length}`;let r=score/session.length;$('message').textContent=r>=.8?'よく理解できています。この調子で分野を広げましょう。':r>=.6?'あと一歩です。間違えた問題の解説を復習しましょう。':'まずは解説を読み、復習モードでもう一度挑戦しましょう。'}
$('start').onclick=()=>begin($('category').value);$('yearExam').onclick=()=>begin($('examYear').value);$('review').onclick=()=>begin('review');$('next').onclick=()=>{if(++pos<session.length)showQ();else finish()};$('again').onclick=()=>begin(lastMode);$('toHome').onclick=renderHome;renderHome();
</script>
<script type="module" src="sync.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
